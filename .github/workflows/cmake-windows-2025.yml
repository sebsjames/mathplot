name: Windows 2025/latest1
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'README**'
      - 'examples/screenshots/**'
      - 'examples/docs/**'
  pull_request:
    branches: [ "main" ]

jobs:
  call-workflow-passing-data:
    uses: sebsjames/mathplot/.github/workflows/cmake-windows-template.yml@main
    with:
      RUNNER_IMAGE: windows-latest
      BUILD_TYPE: Release
      VCPKG_TRIPLET: x64-windows
